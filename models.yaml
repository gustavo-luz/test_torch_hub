# Model zoo catalog, generated from ssl_har_model_zoo.ipynb.
# The 36 models published at https://zenodo.org/records/19301058,
# each with a pretrained and a finetuned checkpoint.
#
# hubconf.py reads this file at run time. Adding a new weight to the zoo
# means adding an entry here, no code changes.

# Encoder architectures, same arguments as the paper.
encoders:
  ts2vec:
    module: minerva.models.nets.tnc
    cls: TSEncoder
    kwargs:
      input_dims: 6
      output_dims: 320
      hidden_dims: 64
      depth: 10
      permute: true
  cnnpff:
    module: minerva.models.nets.time_series.cnns
    cls: CNN_PF_Backbone
    kwargs:
      include_middle: true
      flatten: true
  resnetse5:
    module: minerva.models.nets.time_series.resnet
    cls: _ResNet1D
    kwargs:
      input_shape: [6, 60]
      avg_pooling: true
      residual_block_cls: ResNetSEBlock   # class resolved by hubconf
  rnn:
    module: minerva.models.nets.tnc
    cls: RnnEncoder
    kwargs:
      hidden_size: 100
      in_channel: 6
      encoding_size: 320
      cell_type: "GRU"
      num_layers: 1
      dropout: 0
      bidirectional: true
      permute: true
  imutransformer:
    module: minerva.models.nets.time_series.imu_transformer
    cls: _IMUTransformerEncoder
    kwargs:
      input_shape: [6, 60]
      transformer_dim: 64
      encode_position: true
      nhead: 8
      dim_feedforward: 128
      transformer_dropout: 0.1
      transformer_activation: "gelu"
      num_encoder_layers: 6
      permute: false
  tstcc:
    module: minerva.models.nets.lfr_har_architectures
    cls: HARSCnnEncoder
    kwargs:
      dim: 2304
      input_channel: 6
      inner_conv_output_dim: 1280

# One block per model. The key is the torch.hub entrypoint name.
models:
  diet_resnetse5_kh:
    ssl: diet
    encoder: resnetse5
    dataset: kh
    dataset_name: "KuHar"
    num_classes: 6
    head_input_dim: 64
    accuracy: 80.6   # best accuracy from the paper, Table III
    weights:
      pretrained: https://zenodo.org/records/19301058/files/diet_resnetse5_kh_pretrained.ckpt
      finetuned: https://zenodo.org/records/19301058/files/diet_resnetse5_kh_finetuned.ckpt
